spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: pavan-work
    password:
    driver-class-name: org.postgresql.Driver
    hikari:
      # Diagnostic, added after the 400-trial run showed circuit-breaker's
      # data collapsing to a suspiciously identical ~550 requests/trial
      # across every chaos scenario from partway through that profile
      # onward, at exactly the point Prometheus lost the ability to scrape
      # order-service's own resource metrics -- consistent with a HikariCP
      # connection pool exhaustion/leak that "none" (bulkhead also
      # uncapped, but circuit breaker never legitimately opens) doesn't
      # trigger. leak-detection-threshold makes HikariCP log a full stack
      # trace for any connection held longer than 30s instead of silently
      # exhausting the pool, so a recurrence is diagnosed, not guessed at.
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8081

services:
  inventory:
    base-url: http://localhost:8082
  payment:
    base-url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        resilience4j.circuitbreaker.calls: 0.5,0.95,0.99
      percentiles-histogram:
        http.server.requests: true